name: Build Combined Doc

on:
  workflow_dispatch:
    inputs:
      allow_notebook_errors:
        description: 'Publish the combined doc even if notebooks have execution errors (artifact may contain tracebacks).'
        type: boolean
        default: false
      nb_timeout:
        description: 'Per-cell execution timeout in seconds. Heavy parameter-sweep cells (e.g. nb04, nb05) can exceed the Makefile default of 600. 1800 is a comfortable headroom.'
        type: string
        default: '1800'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: make docs-install
      - name: Build combined doc
        # Translate the workflow_dispatch boolean into the 0/1 the Makefile uses.
        # nb_timeout is forwarded as NB_TIMEOUT (per-cell timeout, seconds).
        run: make docs-jenner ALLOW_NB_ERRORS=${{ inputs.allow_notebook_errors && '1' || '0' }} NB_TIMEOUT=${{ inputs.nb_timeout }}
      - name: Upload combined_mkdocs.md
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: combined_mkdocs
          path: dist/combined_mkdocs.md
          retention-days: 90

      - name: Checkout laser-mcp
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: InstituteforDiseaseModeling/laser-mcp
          token: ${{ secrets.LASER_MCP_TOKEN }}
          path: laser-mcp

      - name: Copy combined doc into laser-mcp
        env:
          DEST_PATH: laser-generic.md   # root of laser-mcp
        run: |
          mkdir -p "laser-mcp/$(dirname "$DEST_PATH")"
          cp dist/combined_mkdocs.md "laser-mcp/$DEST_PATH"

      - name: Create / update PR in laser-mcp
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.LASER_MCP_TOKEN }}
          path: laser-mcp
          base: main                       # laser-mcp's default branch
          branch: auto/sync-laser-generic-doc
          delete-branch: true
          commit-message: "docs: sync laser-generic.md from laser-generic"
          title: "docs: sync laser-generic.md from laser-generic"
          body: |
            Automated sync of the combined doc built by laser-generic.

            Source: ${{ github.repository }}@${{ github.sha }}
