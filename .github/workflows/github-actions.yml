name: build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.tox_env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tox_env: ['py310', 'py314']
        os:      ['ubuntu-latest', 'windows-latest', 'macos-latest']
        include:
          - { tox_env: 'check', os: 'ubuntu-latest' }
          - { tox_env: 'docs',  os: 'ubuntu-latest' }

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: regular build and test
        run: uvx --with tox-uv tox -e ${{ matrix.tox_env }} -v
