name: Build, Release, and Publish

permissions:
  id-token: write
  contents: write
  packages: write

on:
  workflow_dispatch

jobs:

  build:
    name: Build on (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] # [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: 3.13

      - name: Install build tools
        run: python -m pip install uv

      - name: Build wheels
        run: uv build

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Download all built wheels
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist

      - name: Flatten dist directory
        run: |
          mkdir final_dist
          find dist -name '*.whl' -exec mv {} final_dist/ \;

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | sed -E "s/.*= *[\"'](.*)[\"']/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with gh CLI
        run: |
          gh release create "v${{ env.VERSION }}" \
            --title "Release v${{ env.VERSION }}" \
            --notes "Automated release of version v${{ env.VERSION }}" \
            final_dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: restricted
      url: https://pypi.org/p/laser-generic
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Download all built wheels
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist

      - name: Flatten dist directory
        run: |
          mkdir final_dist
          find dist -name '*.whl' -exec mv {} final_dist/ \;

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | sed -E "s/.*= *[\"'](.*)[\"']/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: false
          packages-dir: final_dist
          verbose: true
          print-hash: true

# Note: the docs site deploy is NOT part of the release workflow anymore.
# When a release commit hits main (typically the version bump PR merging),
# the MkDocs Deploy workflow (mkdocs-ghp.yml) fires automatically and
# deploys the site to GitHub Pages, using the executed_nbs artifact
# produced by the Execute Notebooks workflow. That path uses cached
# CI-executed notebooks rather than the in-band mkdocs-jupyter
# execution the removed `docs-deploy` job used, so it's ~30 min faster
# and consistent with the docs site's normal update flow.
