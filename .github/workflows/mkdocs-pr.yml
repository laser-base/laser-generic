name: MkDocs Build on PR

on:
  pull_request:
    branches: [ master, main ]  # Replace with your desired branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install MkDocs and dependencies
      run: |
        pip install --index-url https://packages.idmod.org/artifactory/api/pypi/pypi-production/simple -e ".[docs]"

    - name: Build MkDocs site
      run: mkdocs build

    - name: Upload built site
      uses: actions/upload-artifact@v4
      with:
        name: mkdocs-site-pr-${{ github.event.pull_request.number }}
        path: site/
        retention-days: 14
