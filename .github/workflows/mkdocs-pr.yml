name: MkDocs Build on PR

on:
  pull_request:
    branches: [ master, main ]  # Replace with your desired branches
    # Only run the docs build (which can execute notebooks when
    # MKDOCS_EXECUTE_NOTEBOOKS=true) when a PR touches something that can
    # affect the built docs. PRs that only touch tests, other CI, README,
    # or unrelated files skip the docs-build job.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/mkdocs-pr.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.12'

    - name: Install MkDocs and dependencies
      run: |
        pip install --index-url https://packages.idmod.org/artifactory/api/pypi/pypi-production/simple -e ".[docs]"

    - name: Build MkDocs site
      run: mkdocs build

    - name: Assert API reference content floor
      run: |
        ref_count=$(find site/reference -name 'index.html' 2>/dev/null | wc -l)
        echo "rendered reference pages: $ref_count"
        if [ "$ref_count" -lt 25 ]; then
          echo "ERROR: site/reference is degraded (only $ref_count pages, expected 30+)"
          exit 1
        fi

    - name: Upload built site
      uses: actions/upload-artifact@v4
      with:
        name: mkdocs-site-pr-${{ github.event.pull_request.number }}
        path: site/
        retention-days: 14
